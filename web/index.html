<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ViralThumb</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<header>
  <span class="logo">⚡ ViralThumb</span>
  <span class="tagline">Viral YouTube thumbnails in 3 steps</span>
</header>

<main>

  <!-- ── STEP 1: Pick a style ───────────────────────────────────────── -->
  <section class="step">
    <div class="step-label"><span class="num">1</span> Pick a style</div>
    <div id="style-grid" class="style-grid">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- ── STEP 2 + 3: Upload + Text ─────────────────────────────────── -->
  <section class="step">
    <div class="step-label"><span class="num">2</span> Upload your photo</div>

    <label class="upload-zone" for="photo-input" id="upload-zone">
      <div id="upload-icon">📷</div>
      <div id="upload-hint">Click or drag a photo here</div>
      <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp"/>
      <img id="photo-preview" class="hidden" alt="preview"/>
    </label>
  </section>

  <section class="step">
    <div class="step-label"><span class="num">3</span> Add your text <span class="optional">(optional)</span></div>
    <input  id="headline" class="text-input big"  type="text" placeholder='Headline  e.g.  "I CAN&#39;T BELIEVE"' maxlength="40"/>
    <input  id="sub-text" class="text-input small" type="text" placeholder='Sub-line  e.g.  "THIS ACTUALLY WORKS"' maxlength="40"/>
  </section>

  <!-- ── Generate ───────────────────────────────────────────────────── -->
  <button id="generate-btn" class="btn-generate" disabled>
    ✨ Generate Thumbnail
  </button>

  <!-- ── Spinner ────────────────────────────────────────────────────── -->
  <div id="spinner" class="spinner hidden">
    <div class="ring"></div>
    <p>Cutting out subject · building background · applying effects…</p>
  </div>

  <!-- ── Error ──────────────────────────────────────────────────────── -->
  <div id="error-box" class="error hidden"></div>

  <!-- ── Result ─────────────────────────────────────────────────────── -->
  <div id="result-wrap" class="result-wrap hidden">
    <div class="result-label">Your thumbnail  ↓</div>
    <img id="result-img" src="" alt="Generated thumbnail"/>
    <div class="result-actions">
      <a id="download-btn" href="#" download="viral_thumbnail.jpg" class="btn-dl">⬇ Download 1280×720</a>
      <button id="redo-btn" class="btn-redo">↩ Try another style</button>
    </div>
  </div>

</main>

<script src="/static/app.js"></script>
</body>
</html>
